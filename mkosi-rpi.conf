[Config]
Profiles=core,ubootsecurity,vfat,copykernelimage,commonparts

[Content]
Bootable=no
Packages=kernel,uboot,bcm2711-firmware,bcm2835-firmware,uboot-tools
SkeletonTrees=skeletons/rpi
# could be in a profile in future
PostInstallationScripts=scripts/postinstall/60-uboot-scr.sh.chroot

[Distribution]
Architecture=arm64

[Build]
Environment=REDPESK_BSP=rpi-bsp

[Output]
RepartDirectories=repart.d/rpi
