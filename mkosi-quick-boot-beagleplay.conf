[Config]
Profiles=core,commonparts,vfat,hybrid-mbr,ubootscr

[Content]
Bootable=no
Packages=arm-trusted-firmware,kernel,redpesk-bsp-repos-config,ti-linux-firmware,uboot
SkeletonTrees=skeletons/quick-boot-beagleplay
# install tool to measure boot time and remove unneeded packages
Packages=systemd-bootchart
RemovePackages=dracut,vim

[Distribution]
Architecture=arm64

[Build]
Environment=REDPESK_BSP=beagleplay-bsp

[Output]
RepartDirectories=repart.d/texas-instruments
