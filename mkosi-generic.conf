[Content]
Bootable=yes
Bootloader=grub
Packages=kernel,grub2-efi,grub2-tools,grubby,grub2-common,grub2-efi-aa64-modules,grub2-efi-x64-modules,shim-x64
RemoveFiles=/etc/yum.repos.d/mkosi.repo
KernelCommandLineExtra='console=ttyS0 cgroup_no_v1=all systemd.unified_cgroup_hierarchy=1 rw rootwait security=smack loglevel=7 fsck.mode=skip'
Profiles=generic

