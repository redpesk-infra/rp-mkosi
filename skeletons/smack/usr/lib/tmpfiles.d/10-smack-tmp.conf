# Ensure /tmp always carries the SMACK star label, regardless of how it is
# provided. During image construction /tmp may be a temporary filesystem, so
# any xattr applied at build time would be lost. At runtime /tmp may either be
# part of the root filesystem or mounted separately as tmpfs.
#
# systemd-tmpfiles applies this label at boot after the runtime filesystem is
# available. The lowercase "t" applies the xattr to /tmp itself without
# recursively changing the SMACK labels of files already contained in it.
t /tmp - - - - security.SMACK64=*
