[Config]
Profiles=hybrid-mbr

[Build]
Environment=REDPESK_HYBRID_MBR=1
### Preferred syntax: comma-separated GPT_INDEX:MBR_TYPE:ACTIVE entries.
# Environment=REDPESK_HYBRID_MBR_PARTITIONS=1:0x83:0,2:0x0c:1

### Legacy single-partition syntax (kept for backward compatibility).
# Environment=REDPESK_HYBRID_MBR_PARTITION=1
# Environment=REDPESK_HYBRID_MBR_TYPE=0x0c
# Environment=REDPESK_HYBRID_MBR_ACTIVE=1

# ACTIVE
# 1 means the partition is active/bootable.
# 0 means the partition is non-active.

#Type MBR	Signification
# 0x0b	FAT32
# 0x0c	FAT32 LBA
# 0x07	NTFS / exFAT
# 0x82	Linux swap
# 0x83	Linux filesystem
# 0x8e	Linux LVM
# 0xef	EFI System Partition
# 0xee	GPT protective partition

[Match]
Profiles=hybrid-mbr
