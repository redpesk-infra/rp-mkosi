[Config]
ConfigureScripts=scripts/configure-fix-fstab.sh
Profiles=core

[Include]
Include=mkosi.conf.d/core.conf

[Content]
RemoveFiles=/etc/yum.repos.d/mkosi.repo
RootPassword=root
FinalizeScripts=scripts/manifest.sh
PostOutputScripts=scripts/postoutput-redpesk.sh

[Distribution]
Distribution=rocky
Release=9

[Validation]
Checksum=yes

[Output]
Format=disk
OutputDirectory=output

[Build]
Environment=SYSTEMD_LOG_LEVEL=debug
